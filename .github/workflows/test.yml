# Unified test pipeline:
#  - userspace: fast Lua suite (LuaJIT, 5.1, 5.4, 5.5) of the ipparse tests
#    (no VM)
#  - kernel: full suite (userspace + lunatik kernel modules) inside a
#    virtme-ng microVM on the pinned LTS kernel (tools/vmtest/)
#  - kernel-lunatik-head: same as kernel, but against a Lunatik ref supplied
#    via workflow_dispatch (default: upstream master); non-blocking.
#  - coverage: cumulative LuaJIT + Lua 5.4 luacov report, compared against
#    ipparse/tests/coverage_baseline; non-blocking (warns only).
#
# Lunatik upgrade procedure:
#  1. run kernel-lunatik-head with lunatik_ref=<new tag>;
#  2. once green, update LUNATIK_REF and LUNATIK_COMMIT in
#     tools/vmtest/versions.env to that tag and its commit.
name: test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      lunatik_ref:
        description: Lunatik ref to test in kernel-lunatik-head
        required: false
        default: master
        type: string

jobs:
  userspace:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lua: [luajit, lua5.1, lua5.4, lua5.5]
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Compile MoonScript sources
        run: nix-shell -p luajitPackages.moonscript --run "make -C ipparse all"
      - name: Run test suite
        run: |
          has_ffi=""
          case "${{ matrix.lua }}" in
            luajit) pkg=luajit; bin=luajit; has_ffi=1 ;;
            lua5.1) pkg=lua5_1; bin=lua ;;
            lua5.4) pkg=lua5_4; bin=lua ;;
            lua5.5) pkg=lua5_5; bin=lua ;;
          esac
          if [ -n "$has_ffi" ]; then
            # LuaJIT has FFI: make the optional crypto backends loadable so
            # their tests run instead of being skipped.
            nix-shell -p "$pkg" openssl mbedtls --run \
              "export LD_LIBRARY_PATH=\"\$(ipparse/tests/ffi_libs.sh)\${LD_LIBRARY_PATH:+:\$LD_LIBRARY_PATH}\" && make -C ipparse test-nobuild LUA=$bin"
          else
            nix-shell -p "$pkg" --run "make -C ipparse test-nobuild LUA=$bin"
          fi

  coverage:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Compile MoonScript sources
        run: nix-shell -p luajitPackages.moonscript --run "make -C ipparse all"
      - name: Measure coverage
        run: |
          nix-shell -p 'luajit.withPackages (p: [p.luacov])' \
                    'lua5_4.withPackages (p: [p.luacov])' \
                    openssl mbedtls \
                    --run 'make -C ipparse coverage-nobuild' > coverage.out
          total=$(grep -E '^COVERAGE_TOTAL=' coverage.out | tail -n 1 | cut -d= -f2)
          baseline=$(cat ipparse/tests/coverage_baseline)
          {
            echo "## Test coverage"
            echo ""
            echo "Total: ${total}% (baseline: ${baseline}%)"
            echo ""
            echo '```'
            sed -n '/^Summary$/,$p' coverage.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if awk -v t="$total" -v b="$baseline" 'BEGIN { exit !(t < b) }'; then
            echo "::warning title=Test coverage::Coverage ${total}% is below the baseline ${baseline}%"
          fi

  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential flex bison bc libelf-dev libssl-dev dwarves \
            ccache cpio zstd qemu-system-x86 busybox-static \
            python3-venv rustc cargo \
            luajit luarocks lua5.4 git curl kmod
          sudo luarocks install moonscript

      - name: Enable KVM on the runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Read pinned kernel version
        id: pinned
        run: |
          . tools/vmtest/versions.env
          echo "kernel=$KERNEL_VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore kernel build cache
        uses: actions/cache@v5
        with:
          path: tools/vmtest/build/linux-*
          key: vmtest-kernel-${{ steps.pinned.outputs.kernel }}-${{ hashFiles('tools/vmtest/kernel.fragment') }}

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: vmtest-ccache-${{ hashFiles('tools/vmtest/versions.env') }}
          restore-keys: vmtest-ccache-

      - name: Run full suite in VM
        env:
          VMTEST_RW_DIR: ${{ runner.temp }}/vmtest-rw
        run: make vm-test

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vm-logs
          path: |
            ${{ runner.temp }}/vmtest-rw/console.log
            ${{ runner.temp }}/vmtest-rw/out
          if-no-files-found: ignore

  kernel-lunatik-head:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      LUNATIK_REF: ${{ github.event.inputs.lunatik_ref || 'master' }}
      LUNATIK_COMMIT: ''
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential flex bison bc libelf-dev libssl-dev dwarves \
            ccache cpio zstd qemu-system-x86 busybox-static \
            python3-venv rustc cargo \
            luajit luarocks lua5.4 git curl kmod \
            libbpf-dev pkg-config
          sudo luarocks install moonscript

      - name: Enable KVM on the runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Read pinned kernel version
        id: pinned
        run: |
          . tools/vmtest/versions.env
          echo "kernel=$KERNEL_VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore kernel build cache
        uses: actions/cache@v5
        with:
          path: tools/vmtest/build/linux-*
          key: vmtest-kernel-${{ steps.pinned.outputs.kernel }}-${{ hashFiles('tools/vmtest/kernel.fragment') }}

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: vmtest-ccache-${{ hashFiles('tools/vmtest/versions.env') }}
          restore-keys: vmtest-ccache-

      - name: Run full suite in VM
        env:
          LUNATIK_SRC: ${{ runner.temp }}/lunatik-head
          VMTEST_RW_DIR: ${{ runner.temp }}/vmtest-rw-head
        run: make vm-test

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vm-logs-lunatik-head
          path: |
            ${{ runner.temp }}/vmtest-rw-head/console.log
            ${{ runner.temp }}/vmtest-rw-head/out
          if-no-files-found: ignore
